<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>平板專用倒數計時器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 引入多款科技感數字字型 */
        @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Orbitron:wght@600;900&family=Bebas+Neue&family=Michroma&family=JetBrains+Mono:wght@800&display=swap');

        body {
            font-family: 'Chakra Petch', sans-serif;
            background-color: #050505;
            color: #e0e0e0;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* 字體類別定義 */
        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            letter-spacing: -0.02em;
        }

        .font-bebas {
            font-family: 'Bebas Neue', sans-serif;
            font-weight: 400;
            letter-spacing: 0.05em;
            font-size: 1.5em;
            /* 再加大 */
        }

        .font-michroma {
            font-family: 'Michroma', sans-serif;
            font-weight: 400;
            letter-spacing: -0.05em;
            font-size: 0.85em;
            /* 縮小防止超出 */
        }

        .font-jetbrains {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800;
            letter-spacing: -0.05em;
        }

        .rounded-nums {
            /* 預設繼承或由 JS 切換 */
            transition: font-family 0.3s ease;
        }

        /* 霓虹文字效果 - 柔和版 */
        .neon-text {
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.4),
                0 0 20px rgba(0, 255, 255, 0.2);
            color: #ffffff;
        }

        /* 銀色金屬質感 (Metallic Silver / Chrome) */
        .metallic-text {
            background: linear-gradient(180deg,
                    #f8f9fa 0%,
                    #ffffff 20%,
                    #d1d5db 45%,
                    #9ca3af 50%,
                    #d1d5db 55%,
                    #f3f4f6 80%,
                    #cbd5e1 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            /* 強制邊界光與立體感 */
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.7)) drop-shadow(0 0 1px rgba(255, 255, 255, 0.8));
        }

        .neon-text-finished {
            text-shadow: 0 0 15px rgba(255, 80, 80, 0.9),
                0 0 30px rgba(255, 80, 80, 0.6);
            color: #ffcccc;
            background: none;
            -webkit-background-clip: unset;
            background-clip: unset;
            -webkit-text-fill-color: initial;
            filter: none;
        }

        /* 按鈕樣式 */
        .btn-glass {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .btn-glass:active {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(0.92);
        }

        /* 控制列過渡動畫 */
        .controls-panel {
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.3s ease;
        }

        .controls-hidden {
            transform: translateY(120%);
            opacity: 0;
            pointer-events: none;
        }

        .hidden-force {
            display: none !important;
        }

        .focus-visible:focus-visible,
        button:focus-visible,
        input:focus-visible {
            outline: 3px solid #22d3ee;
            outline-offset: 3px;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* 移除預設的 input number 上下箭頭 */
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* 全螢幕霓虹外框 */
        #neon-border {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 100;
            border: 12px solid transparent;
            transition: all 1s ease;
            opacity: 0;
            box-sizing: border-box;
        }

        @keyframes border-breathe {

            0%,
            100% {
                border-width: 6px;
                filter: brightness(1);
            }

            50% {
                border-width: 14px;
                filter: brightness(1.5);
            }
        }

        /* 幻彩循環動畫 */
        @keyframes border-color-cycle {
            0% {
                border-color: #00ffff;
                box-shadow: inset 0 0 30px #00ffff, 0 0 30px #00ffff;
            }

            25% {
                border-color: #ff00ff;
                box-shadow: inset 0 0 30px #ff00ff, 0 0 30px #ff00ff;
            }

            50% {
                border-color: #ffff00;
                box-shadow: inset 0 0 30px #ffff00, 0 0 30px #ffff00;
            }

            75% {
                border-color: #00ff00;
                box-shadow: inset 0 0 30px #00ff00, 0 0 30px #00ff00;
            }

            100% {
                border-color: #00ffff;
                box-shadow: inset 0 0 30px #00ffff, 0 0 30px #00ffff;
            }
        }

        .border-running {
            opacity: 1 !important;
            animation: border-breathe 3s ease-in-out infinite, border-color-cycle 8s linear infinite;
        }

        /* 讓計時數字最大化且置中 */
        #time-display {
            font-size: min(20vw, 42vh);
            /* 為完整的 MM:SS 保留全螢幕安全邊界 */
            font-variant-numeric: tabular-nums;
            /* 強制等寬數字，防止寬度跳動 */
            font-feature-settings: "tnum";
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: calc(100vw - 6rem);
            white-space: nowrap;
            line-height: 0.9;
        }

        /* 直向模式優化：分在上、秒在下 */
        @media (orientation: portrait) {
            #time-display {
                flex-direction: column;
                gap: 3vh;
                /* 增加垂直間距 */
                font-size: min(42vw, 23vh);
                /* 保留分鐘與秒的完整可見高度 */
                line-height: 0.9;
            }

            #time-sep {
                display: none;
                /* 隱藏冒號，靠上下位置區分 */
            }
        }

        /* 計時中的縮放效果 - 稍微縮小 scale 避免溢出 */
        .display-running {
            transform: scale(1.02);
        }

        /* 時鐘模式：稍微縮小字體以容納 HH:MM:SS */
        .clock-mode-text {
            font-size: min(18vw, 50vh) !important;
        }

        /* 直式時鐘模式優化 */
        /* 直式時鐘模式優化 */
        @media (orientation: portrait) {
            .clock-mode-text {
                flex-direction: row !important;
                font-size: min(18vw, 18vh) !important;
                gap: 0.08em !important;
                line-height: 1;
            }
        }

        /* Michroma 在時鐘模式的特別修正 - 防止超出 */
        .clock-mode-text.font-michroma {
            font-size: min(14vw, 40vh) !important;
        }

        @media (orientation: portrait) {
            .clock-mode-text.font-michroma {
                font-size: min(28vw, 25vh) !important;
            }
        }

        /* 手機版面適配 */
        @media (max-width: 768px) {
            body {
                justify-content: flex-start !important;
            }

            #main-container {
                height: 57vh;
                justify-content: center;
            }

            #controls-panel {
                height: 43vh;
                padding-bottom: 1rem;
            }

            /* 計時中控制列收合後，數字要佔滿手機可視區並保持真正置中。 */
            #main-container.timer-focused {
                height: 100vh;
                height: 100dvh;
                transition: none;
            }

            #main-container.timer-focused #status-text {
                position: absolute;
                top: calc(50% + 24vh);
            }

            .btn-glass {
                padding: 0.5rem 0.75rem;
                font-size: 0.8rem;
            }

            .text-xl {
                font-size: 1rem;
            }

            .w-28 {
                width: 5rem;
                height: 5rem;
            }

            .h-28 {
                width: 5rem;
                height: 5rem;
            }

            /* 調整音效/字型選擇區塊 */
            #sound-selector button,
            #font-selector button {
                padding: 0.25rem 0.5rem;
                font-size: 0.65rem;
            }

            #sound-selector, #font-selector {
                gap: 0.25rem;
            }

            .ml-6 {
                margin-left: 1rem;
            }

            .gap-10 {
                gap: 0.75rem;
            }

            #setup-controls {
                width: calc(100% - 1rem);
                gap: 0.35rem;
                justify-content: center;
            }

            #setup-controls > div {
                gap: 0.25rem;
            }

            #btn-minus,
            #btn-plus {
                width: 2.6rem;
                height: 2.6rem;
                font-size: 1.6rem;
            }

            #setup-controls .quick-add {
                padding: 0.5rem 0.4rem;
                font-size: 0.75rem;
                white-space: nowrap;
            }

            #primary-controls {
                width: 100%;
                display: grid !important;
                grid-template-columns: 1fr auto 1fr;
                grid-template-areas:
                    "reset action spacer"
                    "selectors selectors selectors";
                gap: 0.5rem;
                justify-items: center;
            }

            #btn-reset {
                grid-area: reset;
                justify-self: end;
                padding: 0.65rem 0.9rem;
                gap: 0.35rem;
                white-space: nowrap;
            }

            #btn-main-action {
                grid-area: action;
            }

            #settings-drawer {
                grid-area: selectors;
                width: 100%;
                margin-left: 0;
                text-align: center;
            }

            #settings-drawer > summary {
                display: inline-flex !important;
                align-items: center;
                justify-content: center;
                padding: 0.35rem 0.75rem;
                color: #67e8f9;
                font-size: 0.75rem;
                cursor: pointer;
            }

            #settings-drawer[open] > summary { margin-bottom: 0.35rem; }

            #settings-drawer > .settings-content {
                gap: 0.35rem;
                align-items: center;
            }

            #input-modal > div {
                padding: 1.25rem;
            }

            #input-min,
            #input-sec {
                width: min(36vw, 10rem);
                padding: 0.6rem;
                font-size: min(16vw, 4rem);
            }

            #sound-selector,
            #font-selector {
                align-items: center;
                width: 100%;
            }

            #sound-selector > div,
            #font-selector > div {
                justify-content: center;
                flex-wrap: wrap;
            }

            /* 模式切換按鈕移到右上角避免擋住字型選擇 */
            #btn-mode-toggle {
                position: fixed;
                right: 1rem;
                top: 1rem;
                bottom: auto;
                left: auto;
            }
        }

        @media (max-width: 768px) and (orientation: landscape) and (max-height: 540px) {
            #main-container { height: 100vh; }
            #controls-panel { height: 54vh; padding-bottom: 0.25rem; }
            #setup-controls { margin-bottom: 0.35rem; transform: scale(0.82); }
            #primary-controls { transform: scale(0.82); transform-origin: bottom center; }
            #time-display { font-size: min(20vw, 42vh); }
        }

        @media (min-width: 769px) and (max-width: 1024px) {
            #btn-mode-toggle {
                position: fixed;
                right: 1rem;
                top: 1rem;
                bottom: auto;
                left: auto;
            }
        }

        #input-modal > div { width: min(500px, calc(100vw - 2rem)); }
        #settings-drawer > summary { display: none; }
        #app-message {
            position: fixed; left: 50%; bottom: 1rem; transform: translateX(-50%);
            z-index: 300; max-width: calc(100vw - 2rem); padding: 0.7rem 1rem;
            border: 1px solid rgba(103, 232, 249, 0.55); border-radius: 0.75rem;
            background: rgba(8, 15, 25, 0.94); color: #cffafe; text-align: center;
        }
    </style>
</head>

<body class="h-screen w-screen flex flex-col items-center justify-center relative select-none bg-[#0a0a0a]">

    <!-- 全螢幕霓虹外框 -->
    <div id="neon-border"></div>

    <!-- 主顯示區域 (極大化) -->
    <div id="main-container"
        class="relative w-full h-[80vh] flex flex-col items-center justify-center transition-all duration-500 z-10">

        <!-- 時間顯示 -->
        <!-- 修改：加入 metallic-text -->
        <div id="time-display"
            tabindex="0" aria-label="目前倒數時間，點擊可設定"
            class="rounded-nums neon-text metallic-text tracking-tight cursor-pointer active:scale-95 transition-transform duration-200 select-none">
            <span id="time-hour" class="hidden-force">12</span>
            <span id="time-sep-hour" class="hidden-force">:</span>
            <span id="time-min">05</span>
            <span id="time-sep">:</span>
            <span id="time-sec">00</span>
        </div>

        <!-- 狀態文字 -->
    <div id="status-text" aria-live="assertive"
            class="text-5xl mt-4 font-bold tracking-[0.2em] opacity-0 transition-opacity duration-300 text-red-500 rounded-nums">
            TIME'S UP
        </div>


    </div>

    <!-- 底部控制面板 -->
    <div id="controls-panel"
        class="controls-panel fixed bottom-0 w-full h-[35vh] bg-gradient-to-t from-black via-black/95 to-transparent flex flex-col items-center justify-end pb-10 z-20">

        <!-- 快速加減/輸入區 -->
        <p id="usage-hint" class="text-xs text-cyan-200/60 mb-2">點擊時間可設定倒數；計時中點擊畫面可顯示控制列</p>
        <div id="setup-controls" class="flex items-center gap-4 mb-6">
            <button id="btn-minus"
                aria-label="減少 10 秒" class="btn-glass w-16 h-16 rounded-full text-4xl text-cyan-300 flex items-center justify-center pb-2 font-bold">-</button>
            <div class="flex gap-3">
                <button class="quick-add btn-glass px-5 py-3 rounded-2xl text-lg font-bold tracking-wide"
                    data-add="30">+30秒</button>
                <button class="quick-add btn-glass px-5 py-3 rounded-2xl text-lg font-bold tracking-wide"
                    data-add="60">+1分</button>
                <button class="quick-add btn-glass px-5 py-3 rounded-2xl text-lg font-bold tracking-wide"
                    data-add="300">+5分</button>
            </div>
            <button id="btn-plus"
                aria-label="增加 10 秒" class="btn-glass w-16 h-16 rounded-full text-4xl text-cyan-300 flex items-center justify-center pb-2 font-bold">+</button>
        </div>

        <!-- 主要操作按鈕區 -->
        <div id="primary-controls" class="flex items-center gap-10">

            <!-- 重置 -->
            <button id="btn-reset"
                class="btn-glass px-8 py-4 rounded-full text-red-300 border-red-900/40 hover:bg-red-900/20 flex items-center gap-3 transition-all active:scale-95 group">
                <svg class="group-hover:-rotate-90 transition-transform duration-300" xmlns="http://www.w3.org/2000/svg"
                    width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74-2.74L3 12" />
                </svg>
                <span class="text-xl font-bold">重置</span>
            </button>

            <!-- 開始/暫停 (主按鈕加大) -->
            <button id="btn-main-action"
                aria-label="開始或暫停倒數"
                class="w-28 h-28 rounded-full bg-cyan-500 shadow-[0_0_30px_rgba(6,182,212,0.6)] hover:bg-cyan-400 active:scale-90 transition-all flex items-center justify-center text-white ring-4 ring-cyan-900/50">
                <svg id="icon-play" class="w-14 h-14 ml-2" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M8 5v14l11-7z" />
                </svg>
                <svg id="icon-pause" class="w-14 h-14 hidden-force" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
                </svg>
            </button>

            <!-- 音效與字型選擇區 -->
            <details id="settings-drawer" class="flex flex-col gap-4 ml-6" open>
                <summary>設定</summary>
                <div class="settings-content flex flex-col gap-4">
                <!-- 音效選擇 -->
                <div id="sound-selector" class="flex flex-col items-start gap-2">
                    <span class="text-[10px] text-cyan-400 font-bold tracking-widest uppercase opacity-60">Alarm
                        Sound</span>
                    <div class="flex gap-2">
                        <button id="btn-sound-default"
                            class="btn-glass px-3 py-1.5 rounded-lg text-[10px] font-bold">和弦</button>
                        <button id="btn-sound-thinking"
                            class="btn-glass px-3 py-1.5 rounded-lg text-[10px] font-bold">思考</button>
                        <button id="btn-sound-entertainment"
                            class="btn-glass px-3 py-1.5 rounded-lg text-[10px] font-bold">綜藝</button>
                        <button id="btn-sound-custom"
                            class="btn-glass px-3 py-1.5 rounded-lg text-[10px] font-bold opacity-50">自訂</button>
                    </div>
                    <div class="flex items-center gap-2 text-[10px] text-cyan-100/80">
                        <button id="btn-sound-preview" class="btn-glass px-2 py-1 rounded" aria-label="試聽目前音效">試聽</button>
                        <button id="btn-sound-stop" class="btn-glass px-2 py-1 rounded" aria-label="停止音效">停止</button>
                        <button id="btn-sound-mute" class="btn-glass px-2 py-1 rounded" aria-pressed="false">靜音</button>
                        <label for="sound-volume" class="sr-only">音量</label>
                        <input id="sound-volume" type="range" min="0" max="100" value="70" aria-label="音量">
                    </div>
                </div>
                <!-- 字型選擇 -->
                <div id="font-selector" class="flex flex-col items-start gap-2">
                    <span class="text-[10px] text-purple-400 font-bold tracking-widest uppercase opacity-60">Display
                        Font</span>
                    <div class="flex gap-2">
                        <button class="font-switch btn-glass px-3 py-1.5 rounded-lg text-[10px] font-bold"
                            data-font="orbitron">Orbitron</button>
                        <button class="font-switch btn-glass px-3 py-1.5 rounded-lg text-[10px] font-bold"
                            data-font="bebas">Bebas</button>
                        <button class="font-switch btn-glass px-3 py-1.5 rounded-lg text-[10px] font-bold"
                            data-font="michroma">Michroma</button>
                        <button class="font-switch btn-glass px-3 py-1.5 rounded-lg text-[10px] font-bold"
                            data-font="jetbrains">JetBrains</button>
                    </div>
                </div>
                </div>
            </details>

            <!-- 模式切換 (右下角) -->
            <div class="absolute right-6 bottom-10 flex flex-col gap-2">
                <button id="btn-mode-toggle"
                    aria-label="切換倒數與時鐘模式"
                    class="btn-glass px-4 py-2 rounded-xl text-xs font-bold text-cyan-300 border-cyan-800/50 flex items-center gap-2">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                    切換時鐘
                </button>
            </div>

            <input type="file" id="audio-upload" accept="audio/*" class="hidden">
        </div>

        <!-- 時間到專用按鈕 -->
        <div id="finished-controls"
            class="hidden-force flex items-center gap-6 w-full justify-center absolute bottom-12 left-0">
            <button id="btn-back-settings"
                class="btn-glass px-8 py-4 rounded-2xl text-xl font-bold flex items-center gap-3 text-gray-300 border-gray-600">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
                返回
            </button>
            <button id="btn-restart"
                class="bg-red-600 hover:bg-red-500 text-white px-10 py-4 rounded-2xl text-xl font-bold shadow-[0_0_20px_rgba(220,38,38,0.6)] flex items-center gap-3">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                    <path d="M23 4v6h-6" />
                    <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
                </svg>
                重來
            </button>
        </div>
    </div>

    <div id="app-message" class="hidden-force" role="status" aria-live="polite"></div>

    <!-- 時間輸入 Modal (支援分:秒) -->
    <div id="input-modal" role="dialog" aria-modal="true" aria-labelledby="input-modal-title"
        class="fixed inset-0 bg-black/90 z-[200] hidden-force flex items-center justify-center backdrop-blur-md">
        <div
            class="bg-gray-900 border border-gray-700 p-8 rounded-[2rem] w-[500px] text-center shadow-2xl transform scale-100 transition-transform pointer-events-auto">
            <h3 id="input-modal-title" class="text-2xl text-cyan-400 mb-8 font-bold tracking-wide">設定時間</h3>

            <div class="flex items-center justify-center gap-4 mb-8">
                <div class="flex flex-col">
                    <input type="number" id="input-min" min="0" max="99" inputmode="numeric"
                        class="rounded-nums w-40 bg-gray-800 text-white text-7xl text-center p-4 rounded-2xl border-2 border-gray-600 focus:border-cyan-500 focus:outline-none focus:bg-gray-800 transition-colors placeholder-gray-600"
                        placeholder="00">
                    <span class="text-gray-500 text-sm mt-2 font-bold">分</span>
                </div>
                <span class="text-6xl text-gray-600 -mt-8">:</span>
                <div class="flex flex-col">
                    <input type="number" id="input-sec" min="0" max="59" inputmode="numeric"
                        class="rounded-nums w-40 bg-gray-800 text-white text-7xl text-center p-4 rounded-2xl border-2 border-gray-600 focus:border-cyan-500 focus:outline-none focus:bg-gray-800 transition-colors placeholder-gray-600"
                        placeholder="00">
                    <span class="text-gray-500 text-sm mt-2 font-bold">秒</span>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-6">
                <button id="btn-modal-cancel"
                    class="btn-glass py-4 rounded-2xl text-gray-400 text-xl font-bold hover:bg-white/5">取消</button>
                <button id="btn-modal-confirm"
                    class="bg-cyan-600 hover:bg-cyan-500 text-white py-4 rounded-2xl font-bold text-xl shadow-lg shadow-cyan-900/50">確定</button>
            </div>
        </div>
    </div>

    <script type="module">
        import {
            DEFAULT_TIME_SECONDS,
            MIN_TIME_SECONDS,
            TimerEngine,
            clampTimerSeconds
        } from './js/timer-engine.js';
        import { formatClockParts, formatTimerParts } from './js/time-format.js';

        const VALID_AUDIO_MODES = new Set(['default', 'thinking', 'entertainment', 'custom']);
        const VALID_FONT_MODES = new Set(['orbitron', 'bebas', 'michroma', 'jetbrains']);

        const state = {
            totalSeconds: DEFAULT_TIME_SECONDS,
            remainingSeconds: DEFAULT_TIME_SECONDS,
            endTimestamp: null,
            intervalId: null,
            overtimeIntervalId: null,
            status: 'IDLE',
            isControlsVisible: true,
            audioContext: null,
            audioMode: 'default', // 'default', 'thinking', 'entertainment', 'custom'
            fontMode: 'orbitron', // 'orbitron', 'bebas', 'michroma', 'jetbrains'
            displayMode: 'timer', // 'timer' | 'clock'
            clockIntervalId: null,
            wakeLock: null,
            wakeLockRequestId: 0,
            wakeLockRequestPromise: null,
            customBuffer: null,
            timerEngine: new TimerEngine(DEFAULT_TIME_SECONDS),
        };

        function syncTimerState(snapshot = state.timerEngine.snapshot()) {
            state.totalSeconds = snapshot.totalSeconds;
            state.remainingSeconds = snapshot.remainingSeconds;
            state.endTimestamp = snapshot.endTimestamp;
            state.status = snapshot.status;
            return snapshot;
        }

        function clearTimerInterval() {
            if (state.intervalId !== null) {
                clearInterval(state.intervalId);
                state.intervalId = null;
            }
        }

        function clearOvertimeInterval() {
            if (state.overtimeIntervalId !== null) {
                clearInterval(state.overtimeIntervalId);
                state.overtimeIntervalId = null;
            }
        }

        function startOvertimeInterval() {
            clearOvertimeInterval();
            if (state.displayMode !== 'timer' || state.status !== 'FINISHED') return;
            state.overtimeIntervalId = setInterval(updateDisplay, 1000);
        }

        function clearClockInterval() {
            if (state.clockIntervalId !== null) {
                clearInterval(state.clockIntervalId);
                state.clockIntervalId = null;
            }
        }

        function saveSettings() {
            localStorage.setItem('tablet_timer_seconds', String(state.totalSeconds));
            localStorage.setItem('tablet_timer_audio_mode', state.audioMode);
            localStorage.setItem('tablet_timer_font_mode', state.fontMode);
        }

        function loadSettings() {
            let settingsNeedSaving = false;
            const savedTime = localStorage.getItem('tablet_timer_seconds');
            if (savedTime !== null) {
                syncTimerState(state.timerEngine.setDuration(savedTime));
                settingsNeedSaving ||= String(state.totalSeconds) !== savedTime;
            }

            const savedAudioMode = localStorage.getItem('tablet_timer_audio_mode');
            if (VALID_AUDIO_MODES.has(savedAudioMode)) {
                // File uploads are not persisted in localStorage, so a custom selection
                // cannot be restored after reload without a matching decoded buffer.
                state.audioMode = savedAudioMode === 'custom' ? 'default' : savedAudioMode;
                settingsNeedSaving ||= state.audioMode !== savedAudioMode;
            } else if (savedAudioMode !== null) {
                settingsNeedSaving = true;
            }

            const savedFontMode = localStorage.getItem('tablet_timer_font_mode');
            if (VALID_FONT_MODES.has(savedFontMode)) {
                state.fontMode = savedFontMode;
            } else if (savedFontMode !== null) {
                settingsNeedSaving = true;
            }

            if (settingsNeedSaving) {
                saveSettings();
            }
        }

        function setIdleTimerDuration(seconds) {
            syncTimerState(state.timerEngine.setDuration(seconds));
            saveSettings();
            updateDisplay();
        }

        function adjustTimerDuration(deltaSeconds) {
            syncTimerState(state.timerEngine.adjustDuration(deltaSeconds));

            saveSettings();
            updateDisplay();
        }

        function syncRemainingFromDeadline() {
            syncTimerState(state.timerEngine.tick());
            return state.remainingSeconds;
        }

        const dom = {
            container: document.getElementById('main-container'),
            display: document.getElementById('time-display'),
            timeHour: document.getElementById('time-hour'), // New
            timeSepHour: document.getElementById('time-sep-hour'), // New
            timeMin: document.getElementById('time-min'),
            timeSec: document.getElementById('time-sec'),
            statusText: document.getElementById('status-text'),
            usageHint: document.getElementById('usage-hint'),
            controlsPanel: document.getElementById('controls-panel'),
            setupControls: document.getElementById('setup-controls'),
            mainActionBtn: document.getElementById('btn-main-action'),
            resetBtn: document.getElementById('btn-reset'),
            iconPlay: document.getElementById('icon-play'),
            iconPause: document.getElementById('icon-pause'),
            finishedControls: document.getElementById('finished-controls'),
            btnRestart: document.getElementById('btn-restart'),
            btnBack: document.getElementById('btn-back-settings'),
            btnModeToggle: document.getElementById('btn-mode-toggle'), // New
            // Inputs
            modal: document.getElementById('input-modal'),
            inputMin: document.getElementById('input-min'),
            inputSec: document.getElementById('input-sec'),
            neonBorder: document.getElementById('neon-border'),
            btnSoundDefault: document.getElementById('btn-sound-default'),
            btnSoundThinking: document.getElementById('btn-sound-thinking'),
            btnSoundEntertainment: document.getElementById('btn-sound-entertainment'),
            btnSoundCustom: document.getElementById('btn-sound-custom'),
            btnSoundPreview: document.getElementById('btn-sound-preview'),
            btnSoundStop: document.getElementById('btn-sound-stop'),
            btnSoundMute: document.getElementById('btn-sound-mute'),
            soundVolume: document.getElementById('sound-volume'),
            audioUpload: document.getElementById('audio-upload'),
            settingsDrawer: document.getElementById('settings-drawer'),
            appMessage: document.getElementById('app-message')
        };

        const audioEngine = {
            ctx: null,
            reverbNode: null,
            masterGain: null,
            muted: false,
            volume: 0.7,
            activeSources: new Set(),

            async init() {
                try {
                    if (!this.ctx) {
                        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                        if (!AudioContextClass) throw new Error('Web Audio is not supported');
                        this.ctx = new AudioContextClass();
                        this.masterGain = this.ctx.createGain();
                        this.masterGain.connect(this.ctx.destination);
                        this.reverbNode = await this.createReverb();
                        this.setVolume(this.volume);
                    }
                    if (this.ctx.state === 'suspended') {
                        await this.ctx.resume();
                    }
                    return true;
                } catch (err) {
                    console.warn(`Unable to initialize audio: ${err.message}`);
                    return false;
                }
            },

            trackSource(source) {
                this.activeSources.add(source);
                source.addEventListener('ended', () => this.activeSources.delete(source), { once: true });
                return source;
            },

            stopAll() {
                this.activeSources.forEach(source => {
                    try { source.stop(); } catch (err) { /* Source may already be stopped. */ }
                });
                this.activeSources.clear();
            },

            setVolume(value) {
                this.volume = Math.min(1, Math.max(0, Number(value)));
                if (this.masterGain) this.masterGain.gain.value = this.muted ? 0 : this.volume;
            },

            setMuted(muted) {
                this.muted = muted;
                this.setVolume(this.volume);
            },

            playTone({ frequency, startOffset = 0, duration = 1, type = 'sine', volume = 0.12 }) {
                const startTime = this.ctx.currentTime + startOffset;
                const oscillator = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                oscillator.type = type;
                oscillator.frequency.setValueAtTime(frequency, startTime);
                gain.gain.setValueAtTime(0.0001, startTime);
                gain.gain.exponentialRampToValueAtTime(volume, startTime + 0.025);
                gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

                oscillator.connect(gain);
                gain.connect(this.reverbNode || this.masterGain || this.ctx.destination);
                this.trackSource(oscillator);
                oscillator.start(startTime);
                oscillator.stop(startTime + duration + 0.03);
            },

            playBuiltInAlarm(mode) {
                const patterns = {
                    // 清晰、短促的開場鐘聲，適合立即確認操作與時間到提示。
                    default: [
                        { frequency: 880, duration: 1.4, type: 'sine', volume: 0.16 },
                        { frequency: 1320, startOffset: 0.04, duration: 1.2, type: 'sine', volume: 0.1 },
                        { frequency: 1760, startOffset: 0.08, duration: 0.9, type: 'triangle', volume: 0.06 }
                    ],
                    // 柔和上行的思考提示，和開場鐘聲保持明顯區隔。
                    thinking: [
                        { frequency: 523.25, duration: 0.75, type: 'sine', volume: 0.1 },
                        { frequency: 659.25, startOffset: 0.22, duration: 0.8, type: 'sine', volume: 0.1 },
                        { frequency: 783.99, startOffset: 0.44, duration: 1.1, type: 'triangle', volume: 0.09 }
                    ],
                    // 節奏更快、明亮的綜藝提示音。
                    entertainment: [
                        { frequency: 523.25, duration: 0.28, type: 'triangle', volume: 0.14 },
                        { frequency: 659.25, startOffset: 0.16, duration: 0.28, type: 'triangle', volume: 0.14 },
                        { frequency: 783.99, startOffset: 0.32, duration: 0.28, type: 'triangle', volume: 0.14 },
                        { frequency: 1046.5, startOffset: 0.48, duration: 0.85, type: 'sine', volume: 0.14 }
                    ]
                };

                (patterns[mode] || patterns.default).forEach(tone => this.playTone(tone));
            },

            async createReverb() {
                const len = this.ctx.sampleRate * 1.5;
                const buffer = this.ctx.createBuffer(2, len, this.ctx.sampleRate);
                for (let channel = 0; channel < 2; channel++) {
                    const data = buffer.getChannelData(channel);
                    for (let i = 0; i < len; i++) {
                        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.5);
                    }
                }
                const convolver = this.ctx.createConvolver();
                convolver.buffer = buffer;
                convolver.connect(this.masterGain || this.ctx.destination);
                return convolver;
            },

            async playBeep() {
                if (!(await this.init())) return;
                const t = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(1200, t);
                osc.frequency.exponentialRampToValueAtTime(1000, t + 0.05);

                gain.gain.setValueAtTime(0, t);
                gain.gain.linearRampToValueAtTime(0.1, t + 0.005);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);

                osc.connect(gain);
                gain.connect(this.reverbNode || this.masterGain || this.ctx.destination);

                this.trackSource(osc);
                osc.start(t);
                osc.stop(t + 0.1);
            },

            async playAlarm() {
                if (!(await this.init())) return;
                this.stopAll();

                // 自訂音效保留原檔播放；內建音效使用三組可停止的合成提示音。
                let bufferToPlay = null;

                if (state.audioMode === 'custom' && state.customBuffer) {
                    bufferToPlay = state.customBuffer;
                }

                if (bufferToPlay) {
                    const source = this.ctx.createBufferSource();
                    source.buffer = bufferToPlay;
                    source.connect(this.reverbNode || this.masterGain || this.ctx.destination);
                    this.trackSource(source);
                    source.start(0);
                    return;
                }

                this.playBuiltInAlarm(state.audioMode);
            }
        };


        function updateDisplay() {
            const isOvertime = state.status === 'FINISHED';
            const secondsToDisplay = isOvertime
                ? state.timerEngine.getOvertimeSeconds()
                : state.remainingSeconds;
            const { minutes: m, seconds: s } = formatTimerParts(secondsToDisplay);
            dom.timeMin.textContent = isOvertime ? `-${m}` : m;
            dom.timeSec.textContent = s;

            const pct = state.totalSeconds > 0 ? (state.remainingSeconds / state.totalSeconds) * 100 : 0;


            // 更新外框顏色與呼吸效果
            if (state.status === 'RUNNING') {
                dom.neonBorder.classList.add('border-running');
                dom.display.classList.add('display-running');

                // 外框現在使用 CSS 動畫自動循環顏色，這裡不再覆蓋


                dom.display.classList.remove('neon-text-finished');
                dom.display.style.color = '#ffffff';
                dom.statusText.style.opacity = '0';
            } else if (state.status === 'FINISHED') {
                dom.neonBorder.classList.add('border-running');
                dom.neonBorder.style.borderColor = '#ff5050';
                dom.neonBorder.style.boxShadow = `inset 0 0 50px #ff5050, 0 0 50px #ff5050`;

                dom.display.classList.add('neon-text-finished');
                dom.statusText.style.opacity = '1';
                dom.display.classList.remove('display-running');
            } else {
                dom.neonBorder.classList.remove('border-running');
                dom.neonBorder.style.borderColor = 'transparent';
                dom.neonBorder.style.boxShadow = 'none';
                dom.display.classList.remove('display-running');
                dom.display.classList.remove('neon-text-finished');
                dom.statusText.style.opacity = '0';
            }
        }

        function updateControlsUI() {
            if (state.status === 'RUNNING') {
                dom.iconPlay.classList.add('hidden-force');
                dom.iconPause.classList.remove('hidden-force');
                dom.setupControls.classList.add('hidden-force');
                dom.resetBtn.classList.remove('opacity-0', 'pointer-events-none');
            } else if (state.status === 'PAUSED') {
                dom.iconPlay.classList.remove('hidden-force');
                dom.iconPause.classList.add('hidden-force');
                dom.setupControls.classList.remove('hidden-force'); // 暫停時顯示加減鈕
            } else if (state.status === 'IDLE') {
                dom.iconPlay.classList.remove('hidden-force');
                dom.iconPause.classList.add('hidden-force');
                dom.setupControls.classList.remove('hidden-force');
            }
            dom.usageHint.classList.toggle('hidden-force', state.status !== 'IDLE');

            // 更新音效選取按鈕
            [dom.btnSoundDefault, dom.btnSoundThinking, dom.btnSoundEntertainment, dom.btnSoundCustom].forEach(btn => {
                btn.classList.remove('ring-1', 'ring-cyan-500/50', 'bg-cyan-500/10');
                btn.classList.add('opacity-50');
            });

            const activeBtnMap = {
                'default': dom.btnSoundDefault,
                'thinking': dom.btnSoundThinking,
                'entertainment': dom.btnSoundEntertainment,
                'custom': dom.btnSoundCustom
            };

            const activeBtn = activeBtnMap[state.audioMode];
            if (activeBtn) {
                activeBtn.classList.add('ring-1', 'ring-cyan-500/50', 'bg-cyan-500/10');
                activeBtn.classList.remove('opacity-50');
            }

            // 更新字型選取按鈕
            document.querySelectorAll('.font-switch').forEach(btn => {
                const f = btn.dataset.font;
                if (f === state.fontMode) {
                    btn.classList.add('ring-1', 'ring-purple-500/50', 'bg-purple-500/10');
                    btn.classList.remove('opacity-50');
                } else {
                    btn.classList.remove('ring-1', 'ring-purple-500/50', 'bg-purple-500/10');
                    btn.classList.add('opacity-50');
                }
            });

            // 套用字型到顯示器
            dom.display.classList.remove('font-orbitron', 'font-bebas', 'font-michroma', 'font-jetbrains');
            dom.display.classList.add(`font-${state.fontMode}`);

            if (state.status === 'FINISHED') {
                dom.setupControls.classList.add('hidden-force');
                dom.mainActionBtn.parentElement.classList.add('hidden-force');
                dom.finishedControls.classList.remove('hidden-force');
            } else {
                dom.finishedControls.classList.add('hidden-force');
                dom.mainActionBtn.parentElement.classList.remove('hidden-force');
            }
        }

        function shouldKeepScreenAwake() {
            return state.displayMode === 'clock' || state.status === 'RUNNING';
        }

        // Wake Lock API Implementation
        async function requestWakeLock() {
            if (!shouldKeepScreenAwake() || !('wakeLock' in navigator)) return null;
            if (state.wakeLock !== null) return state.wakeLock;
            if (state.wakeLockRequestPromise !== null) return state.wakeLockRequestPromise;

            const requestId = ++state.wakeLockRequestId;
            const requestPromise = (async () => {
                try {
                    const wakeLock = await navigator.wakeLock.request('screen');
                    if (requestId !== state.wakeLockRequestId || !shouldKeepScreenAwake()) {
                        await wakeLock.release();
                        return null;
                    }

                    state.wakeLock = wakeLock;
                    wakeLock.addEventListener('release', () => {
                        if (state.wakeLock === wakeLock) {
                            state.wakeLock = null;
                        }
                    });
                    console.log('Wake Lock active');
                    return wakeLock;
                } catch (err) {
                    console.warn(`Unable to acquire Wake Lock: ${err.name}, ${err.message}`);
                    return null;
                }
            })();

            state.wakeLockRequestPromise = requestPromise;
            try {
                return await requestPromise;
            } finally {
                if (state.wakeLockRequestPromise === requestPromise) {
                    state.wakeLockRequestPromise = null;
                }
            }
        }

        async function releaseWakeLock() {
            const wakeLock = state.wakeLock;
            state.wakeLock = null;
            state.wakeLockRequestId++;
            state.wakeLockRequestPromise = null;

            if (wakeLock === null) return;
            try {
                await wakeLock.release();
                console.log('Wake Lock released');
            } catch (err) {
                console.warn(`Unable to release Wake Lock: ${err.name}, ${err.message}`);
            }
        }

        function syncWakeLock() {
            return shouldKeepScreenAwake() ? requestWakeLock() : releaseWakeLock();
        }

        // Browsers may release the lock while hidden; request a fresh one only when needed.
        document.addEventListener('visibilitychange', async () => {
            if (document.visibilityState === 'visible') {
                await syncWakeLock();
            } else {
                await releaseWakeLock();
            }
        });

        function startTimer() {
            if (state.status === 'RUNNING' || state.remainingSeconds <= 0) return;
            clearOvertimeInterval();
            syncTimerState(state.timerEngine.start());
            clearTimerInterval();
            audioEngine.init();
            updateControlsUI();
            updateDisplay();
            hideControls(); // 開始後自動隱藏控制列
            syncWakeLock();

            state.intervalId = setInterval(() => {
                syncRemainingFromDeadline();
                updateDisplay();
                if (state.remainingSeconds <= 0) {
                    finishTimer();
                }
            }, 1000);
        }

        function pauseTimer() {
            syncTimerState(state.timerEngine.pause());
            clearTimerInterval();
            audioEngine.stopAll();
            updateControlsUI();
            updateDisplay();
            showControls(); // 暫停時自動顯示控制列
            syncWakeLock();
        }

        function resetTimer() {
            clearTimerInterval();
            clearOvertimeInterval();
            syncTimerState(state.timerEngine.reset());
            audioEngine.stopAll();
            saveSettings();
            updateControlsUI();
            updateDisplay();
            showControls();
            syncWakeLock();
        }

        function finishTimer() {
            clearTimerInterval();
            // tick() 已在精確 endTimestamp 設定 finishedAt，不能在此覆寫。
            if (state.status !== 'FINISHED') syncTimerState(state.timerEngine.finish());
            updateDisplay();
            updateControlsUI();
            showControls();
            startOvertimeInterval();
            audioEngine.playAlarm();
            syncWakeLock();
        }

        // Clock Mode Logic
        function updateClock() {
            const { hours: h, minutes: m, seconds: s } = formatClockParts();

            dom.timeHour.textContent = h;
            dom.timeMin.textContent = m;
            dom.timeSec.textContent = s;
        }

        function startClock() {
            clearOvertimeInterval();
            updateClock();
            clearClockInterval();
            state.clockIntervalId = setInterval(updateClock, 1000);
            dom.timeHour.classList.remove('hidden-force');
            dom.timeSepHour.classList.remove('hidden-force');
            dom.display.classList.add('clock-mode-text'); // Add Smaller Font Class

            // Hide Timer Controls
            dom.setupControls.classList.add('hidden-force');
            dom.mainActionBtn.classList.add('hidden-force'); // Hide Main Button ONLY
            dom.resetBtn.classList.add('hidden-force');
            dom.finishedControls.classList.add('hidden-force');
            // Note: We keep the parent container and aesthetic controls visible

            dom.btnModeToggle.innerHTML = `
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
                切換倒數
            `;

            syncWakeLock();
        }

        function stopClock() {
            clearClockInterval();
            audioEngine.stopAll();
            dom.timeHour.classList.add('hidden-force');
            dom.timeSepHour.classList.add('hidden-force');
            dom.display.classList.remove('clock-mode-text'); // Remove Smaller Font Class

            // Restore Timer Controls (Visibility handled by updateControlsUI)
            dom.mainActionBtn.classList.remove('hidden-force');
            dom.resetBtn.classList.remove('hidden-force');
            dom.resetBtn.classList.remove('hidden-force');

            dom.btnModeToggle.innerHTML = `
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                切換時鐘
            `;
            syncWakeLock();
        }

        function toggleMode() {
            audioEngine.playBeep();
            if (state.displayMode === 'timer') {
                // Switch to Clock
                if (state.status === 'RUNNING') pauseTimer(); // Pause timer if running
                state.displayMode = 'clock';
                startClock();
            } else {
                // Switch to Timer
                state.displayMode = 'timer';
                stopClock();
                updateDisplay(); // Restore timer display
                updateControlsUI(); // Restore controls
                startOvertimeInterval();
            }
        }

        function toggleControls() {
            if (state.status === 'FINISHED') {
                showControls();
                return;
            }
            state.isControlsVisible ? hideControls() : showControls();
        }

        function hideControls() {
            state.isControlsVisible = false;
            dom.controlsPanel.classList.add('controls-hidden');
            dom.container.classList.toggle('timer-focused', state.displayMode === 'timer' && state.status === 'RUNNING');
            // 控制列收起時保持字體比例，避免與執行中縮放疊加而裁切數字。
            dom.container.style.transform = 'scale(1)';
        }

        function showControls() {
            state.isControlsVisible = true;
            dom.controlsPanel.classList.remove('controls-hidden');
            dom.container.classList.remove('timer-focused');
            // 恢復原始比例，同樣保持置中
            dom.container.style.transform = 'scale(1)';
        }

        let messageTimer = null;
        function showMessage(message) {
            dom.appMessage.textContent = message;
            dom.appMessage.classList.remove('hidden-force');
            clearTimeout(messageTimer);
            messageTimer = setTimeout(() => dom.appMessage.classList.add('hidden-force'), 4000);
        }

        function syncSettingsDrawer() {
            dom.settingsDrawer.open = !window.matchMedia('(max-width: 768px)').matches;
        }

        let modalReturnFocus = null;
        function closeTimeModal() {
            dom.modal.classList.add('hidden-force');
            modalReturnFocus?.focus();
            modalReturnFocus = null;
        }

        function openTimeModal(trigger) {
            modalReturnFocus = trigger;
            const min = Math.floor(state.totalSeconds / 60);
            const sec = state.totalSeconds % 60;
            dom.inputMin.value = min.toString().padStart(2, '0');
            dom.inputSec.value = sec.toString().padStart(2, '0');
            dom.modal.classList.remove('hidden-force');
            dom.inputMin.focus();
            dom.inputMin.select();
        }

        function bindEvents() {
            document.body.addEventListener('click', (e) => {
                if (dom.modal.contains(e.target) && !dom.modal.classList.contains('hidden-force')) return;
                toggleControls();
            });

            dom.controlsPanel.addEventListener('click', (e) => e.stopPropagation());

            dom.mainActionBtn.addEventListener('click', (e) => {
                e.stopPropagation();

                // 請求全螢幕 (必須在使用者點擊事件中觸發)
                try {
                    const docEl = document.documentElement;
                    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                        if (docEl.requestFullscreen) {
                            docEl.requestFullscreen().catch(() => showMessage('無法進入全螢幕，請確認瀏覽器權限。'));
                        } else if (docEl.webkitRequestFullscreen) {
                            docEl.webkitRequestFullscreen(); // Safari
                        }
                    }
                } catch (err) {
                    console.log("Fullscreen not supported", err);
                }

                if (state.status === 'RUNNING') {
                    pauseTimer();
                } else {
                    startTimer();
                }
            });

            dom.resetBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                audioEngine.playBeep();
                resetTimer();
            });

            // 快速加時間 (支援秒數)
            document.querySelectorAll('.quick-add').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    audioEngine.playBeep();
                    adjustTimerDuration(Number.parseInt(btn.dataset.add, 10));
                });
            });

            // +/- 按鈕
            const adjustTime = (deltaSec) => {
                adjustTimerDuration(deltaSec);
            };

            ['btn-plus', 'btn-minus'].forEach(id => {
                const btn = document.getElementById(id);
                let pressTimer;
                const delta = id === 'btn-plus' ? 10 : -10;

                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    audioEngine.playBeep();
                    adjustTime(delta);
                });
                const stopPress = () => clearInterval(pressTimer);
                btn.addEventListener('pointerdown', (e) => {
                    e.stopPropagation();
                    btn.setPointerCapture?.(e.pointerId);
                    pressTimer = setInterval(() => adjustTime(delta), 100);
                });
                btn.addEventListener('pointerup', stopPress);
                btn.addEventListener('pointercancel', stopPress);
                btn.addEventListener('pointerleave', stopPress);
            });

            dom.btnRestart.addEventListener('click', (e) => {
                e.stopPropagation();
                audioEngine.stopAll();
                syncTimerState(state.timerEngine.reset());
                updateControlsUI();
                startTimer();
            });

            dom.btnBack.addEventListener('click', (e) => {
                e.stopPropagation();
                resetTimer();
            });

            // 音效切換
            dom.btnSoundDefault.addEventListener('click', (e) => {
                e.stopPropagation();
                audioEngine.stopAll();
                state.audioMode = 'default';
                audioEngine.playAlarm();
                updateControlsUI();
                saveSettings();
            });

            dom.btnSoundThinking.addEventListener('click', (e) => {
                e.stopPropagation();
                audioEngine.stopAll();
                state.audioMode = 'thinking';
                audioEngine.playAlarm(); // Preview Sound
                updateControlsUI();
                saveSettings();
            });

            dom.btnSoundEntertainment.addEventListener('click', (e) => {
                e.stopPropagation();
                audioEngine.stopAll();
                state.audioMode = 'entertainment';
                audioEngine.playAlarm(); // Preview Sound
                updateControlsUI();
                saveSettings();
            });

            dom.btnSoundCustom.addEventListener('click', (e) => {
                e.stopPropagation();
                dom.audioUpload.click();
            });

            dom.btnSoundPreview.addEventListener('click', (e) => {
                e.stopPropagation();
                audioEngine.playAlarm();
            });
            dom.btnSoundStop.addEventListener('click', (e) => {
                e.stopPropagation();
                audioEngine.stopAll();
            });
            dom.btnSoundMute.addEventListener('click', (e) => {
                e.stopPropagation();
                audioEngine.setMuted(!audioEngine.muted);
                dom.btnSoundMute.textContent = audioEngine.muted ? '取消靜音' : '靜音';
                dom.btnSoundMute.setAttribute('aria-pressed', String(audioEngine.muted));
            });
            dom.soundVolume.addEventListener('input', (e) => {
                audioEngine.setMuted(false);
                audioEngine.setVolume(Number(e.target.value) / 100);
                dom.btnSoundMute.textContent = '靜音';
                dom.btnSoundMute.setAttribute('aria-pressed', 'false');
            });

            dom.audioUpload.addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = async (ev) => {
                        if (!(await audioEngine.init())) return;
                        try {
                            audioEngine.stopAll();
                            const buffer = await audioEngine.ctx.decodeAudioData(ev.target.result);
                            state.customBuffer = buffer;
                            state.audioMode = 'custom';
                            updateControlsUI();
                            saveSettings();
                            audioEngine.playAlarm(); // Preview Sound
                        } catch (err) {
                            console.warn('Unable to decode custom audio.', err);
                            showMessage('無法讀取此音效檔，請改用其他音訊格式。');
                        } finally {
                            dom.audioUpload.value = '';
                        }
                    };
                    reader.readAsArrayBuffer(file);
                }
            });

            // 字型切換
            document.querySelectorAll('.font-switch').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    state.fontMode = btn.dataset.font;
                    audioEngine.playBeep();
                    updateControlsUI();
                    saveSettings();
                });
            });

            dom.btnModeToggle.addEventListener('click', (e) => {
                e.stopPropagation();
                toggleMode();
            });

            dom.display.addEventListener('click', (e) => {
                // Clock Mode: Toggle controls
                if (state.displayMode === 'clock') {
                    return; // Let bubbling handle toggleControls
                }

                // Timer Mode: 如果是運行中或暫停中，點擊時間數字應該是切換控制面板，而不是打開設定
                if (state.status !== 'IDLE') {
                    // 不 call stopPropagation，讓事件冒泡到 body 觸發 toggleControls
                    return;
                }

                e.stopPropagation();
                openTimeModal(dom.display);
            });

            document.getElementById('btn-modal-cancel').addEventListener('click', (e) => {
                e.stopPropagation();
                closeTimeModal();
            });

            document.getElementById('btn-modal-confirm').addEventListener('click', (e) => {
                e.stopPropagation();
                let m = parseInt(dom.inputMin.value) || 0;
                let s = parseInt(dom.inputSec.value) || 0;

                // 限制
                if (m < 0) m = 0;
                if (s < 0) s = 0;
                if (s > 59) s = 59; // 通常輸入秒數不超過 59

                setIdleTimerDuration(m * 60 + s);
                closeTimeModal();
            });

            // 點擊背景關閉 Modal
            dom.modal.addEventListener('click', (e) => {
                if (e.target === dom.modal) {
                    closeTimeModal();
                }
            });

            // 自動跳轉 Input
            dom.inputMin.addEventListener('input', (e) => {
                if (dom.inputMin.value.length >= 2) {
                    dom.inputSec.focus();
                    dom.inputSec.select();
                }
            });

            document.addEventListener('keydown', (e) => {
                const isInput = ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName);
                if (e.key === 'Escape' && !dom.modal.classList.contains('hidden-force')) {
                    e.preventDefault();
                    closeTimeModal();
                    return;
                }
                if (e.key === 'Tab' && !dom.modal.classList.contains('hidden-force')) {
                    const focusable = [...dom.modal.querySelectorAll('button, input')];
                    const currentIndex = focusable.indexOf(document.activeElement);
                    const nextIndex = e.shiftKey
                        ? (currentIndex <= 0 ? focusable.length - 1 : currentIndex - 1)
                        : (currentIndex === focusable.length - 1 ? 0 : currentIndex + 1);
                    e.preventDefault();
                    focusable[nextIndex].focus();
                    return;
                }
                if (isInput) return;
                const isTimerMode = state.displayMode === 'timer';
                if (e.key === ' ') {
                    e.preventDefault();
                    if (isTimerMode && !dom.mainActionBtn.classList.contains('hidden-force')) dom.mainActionBtn.click();
                }
                if (e.key.toLowerCase() === 'r' && isTimerMode) { e.preventDefault(); resetTimer(); }
                if (e.key.toLowerCase() === 'm') { e.preventDefault(); dom.btnSoundMute.click(); }
                if (isTimerMode && (e.key === 'ArrowUp' || e.key === 'ArrowRight')) { e.preventDefault(); adjustTimerDuration(10); }
                if (isTimerMode && (e.key === 'ArrowDown' || e.key === 'ArrowLeft')) { e.preventDefault(); adjustTimerDuration(-10); }
                if (e.key.toLowerCase() === 'f') {
                    e.preventDefault();
                    const docEl = document.documentElement;
                    if (docEl.requestFullscreen) docEl.requestFullscreen().catch(() => showMessage('無法進入全螢幕，請確認瀏覽器權限。'));
                    else if (docEl.webkitRequestFullscreen) docEl.webkitRequestFullscreen();
                }
            });

            updateControlsUI();
        }

        function init() {
            loadSettings();
            updateDisplay();
            updateControlsUI();
            bindEvents();
            syncSettingsDrawer();
            window.addEventListener('resize', syncSettingsDrawer);
        }

        init();
    </script>
</body>

</html>
